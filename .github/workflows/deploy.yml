name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Los checks corren también en los PR, sin desplegar: así una rama llega a
  # main ya verificada en vez de verificarse mientras se publica.
  pull_request:
    branches: [main]
  # Permite lanzar el despliegue a mano desde la pestaña Actions.
  workflow_dispatch:

# Solo lectura del repo; el resto de permisos los pide deploy-pages.
permissions:
  contents: read

# Un despliegue a la vez. No se cancela el que está en vuelo, para no dejar
# Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La versión la manda .nvmrc, para que local y CI no se separen.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Solo al desplegar: en un PR no hay nada que publicar, y Pages
      # rechazaría la configuración desde una rama.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
